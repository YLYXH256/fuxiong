<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="付雄 - 西安工业大学测控技术与仪器专业本科在读，军训连队负责人、军训优秀学员，达摩院AI训练师高级认证，数据分析与技术支持方向个人简历">
<title>付雄 · 个人简历</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --primary:#4f46e5; --primary-light:#818cf8; --primary-dark:#3730a3;
  --secondary:#0d9488; --secondary-light:#2dd4bf;
  --accent:#f59e0b;
  --bg:#f4f6fb; --bg-card:#ffffff; --bg-soft:#f8fafc;
  --bg-hero:linear-gradient(135deg,#eef2ff 0%,#f0fdfa 55%,#fffbeb 100%);
  --text:#1e293b; --text-2:#475569; --text-muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 2px 12px rgba(15,23,42,.05);
  --shadow-hover:0 10px 30px rgba(15,23,42,.10);
  --radius:16px; --radius-sm:10px;
  --nav-h:60px; --max-w:1080px;
  --progress-bg:#e2e8f0; --badge-bg:#eef2ff; --badge-text:#4f46e5;
  --glow-1:rgba(79,70,229,.14); --glow-2:rgba(13,148,136,.12);
  --tr:200ms cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
[data-theme="dark"]{
  --primary:#818cf8; --primary-light:#a5b4fc; --primary-dark:#6366f1;
  --secondary:#2dd4bf; --secondary-light:#5eead4;
  --accent:#fbbf24;
  --bg:#0f172a; --bg-card:#1e293b; --bg-soft:#16213a;
  --bg-hero:linear-gradient(135deg,#1e1b4b 0%,#134e4a 55%,#451a03 100%);
  --text:#f1f5f9; --text-2:#cbd5e1; --text-muted:#94a3b8;
  --border:#334155;
  --shadow:0 2px 12px rgba(0,0,0,.3);
  --shadow-hover:0 10px 30px rgba(0,0,0,.45);
  --progress-bg:#334155; --badge-bg:#312e81; --badge-text:#a5b4fc;
  --glow-1:rgba(129,140,248,.18); --glow-2:rgba(45,212,191,.14);
}
/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px);font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  transition:background var(--tr),color var(--tr);
}
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-orbs::before,.bg-orbs::after{content:'';position:absolute;border-radius:50%;filter:blur(90px);opacity:.4}
.bg-orbs::before{width:420px;height:420px;background:var(--glow-1);top:-110px;left:-120px;animation:orb 14s ease-in-out infinite alternate}
.bg-orbs::after{width:380px;height:380px;background:var(--glow-2);bottom:-90px;right:-110px;animation:orb 18s ease-in-out infinite alternate-reverse}
@keyframes orb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.08)}100%{transform:translate(-20px,-40px) scale(.95)}}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 1px);
  background-size:32px 32px;opacity:.35;
  mask-image:radial-gradient(ellipse at center,black 20%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 72%);
}
main,footer,nav{position:relative;z-index:1}
.container{max-width:var(--max-w);margin:0 auto;padding:0 20px}
section{padding:56px 0 8px}
.section-title{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:800;letter-spacing:.02em;margin-bottom:6px}
.section-title::before{content:'';width:6px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--secondary))}
.section-sub{color:var(--text-muted);font-size:.9rem;margin-bottom:26px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform var(--tr),box-shadow var(--tr),border-color var(--tr)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary-light)}
strong{color:var(--primary);font-weight:700}
/* 进入淡入 */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
.reveal.visible{opacity:1;transform:none}
/* ============ 导航栏 ============ */
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;min-height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 20px;background:color-mix(in srgb,var(--bg-card) 85%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);transition:box-shadow var(--tr)}
.navbar.scrolled{box-shadow:0 2px 22px rgba(15,23,42,.09)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;color:var(--text);text-decoration:none;white-space:nowrap}
.brand .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 0 10px var(--glow-1);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--glow-1)}50%{box-shadow:0 0 20px var(--glow-1),0 0 30px var(--glow-2)}}
.nav-links{display:flex;gap:2px;list-style:none;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{color:var(--text-2);text-decoration:none;font-size:.84rem;font-weight:500;padding:8px 14px;border-radius:20px;white-space:nowrap;transition:all var(--tr)}
.nav-links a:hover{color:var(--primary);background:var(--badge-bg)}
.nav-links a.active{color:var(--primary);background:var(--badge-bg);font-weight:600}
.nav-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ============ Hero ============ */
.hero{padding:calc(var(--nav-h) + 54px) 0 20px;background:var(--bg-hero);border-bottom:1px solid var(--border)}
.hero-inner{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.avatar{width:118px;height:118px;border-radius:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 12px 32px var(--glow-1)}
.avatar span{font-size:3rem;font-weight:800;color:#fff;letter-spacing:.05em}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.hero-main{flex:1;min-width:280px}
.hero-tag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--secondary);background:color-mix(in srgb,var(--secondary) 12%,transparent);padding:4px 12px;border-radius:20px;margin-bottom:10px}
.hero h1{font-size:2.3rem;font-weight:800;letter-spacing:.02em;line-height:1.2}
.hero .subtitle{color:var(--text-2);font-size:1rem;margin:6px 0 12px}
.hero .bio{color:var(--text-2);font-size:.92rem;max-width:640px;margin-bottom:16px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.badge{font-size:.78rem;font-weight:600;color:var(--badge-text);background:var(--badge-bg);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);padding:5px 13px;border-radius:20px;transition:all var(--tr)}
.badge:hover{transform:translateY(-2px)}
.contact-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600;padding:10px 20px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:all var(--tr);font-family:var(--font)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 16px var(--glow-1)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--glow-1)}
.btn-ghost{background:var(--bg-card);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
/* ============ 亮点 ============ */
.highlights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.hl-card{padding:22px 20px;text-align:left;position:relative;overflow:hidden}
.hl-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary))}
.hl-num{font-size:1.9rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hl-label{font-weight:700;font-size:.95rem;margin:2px 0 4px}
.hl-desc{color:var(--text-muted);font-size:.8rem}
/* ============ Tabs ============ */
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:22px}
.tab-btn{flex:1;min-width:120px;padding:10px 16px;border:none;border-radius:10px;background:transparent;color:var(--text-2);font-size:.88rem;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:var(--font);white-space:nowrap}
.tab-btn:hover{color:var(--primary)}
.tab-btn[aria-selected="true"]{background:var(--bg-card);color:var(--primary);box-shadow:var(--shadow)}
.tab-panel{display:none;animation:fadeUp .35s ease}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* 经历卡片 */
.exp-card{padding:26px 28px}
.exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--border)}
.exp-title{font-size:1.12rem;font-weight:800}
.exp-org{color:var(--secondary);font-weight:600;font-size:.9rem;margin-top:2px}
.exp-date{font-size:.8rem;font-weight:600;color:var(--text-muted);background:var(--bg-soft);border:1px solid var(--border);padding:4px 12px;border-radius:20px;white-space:nowrap}
.exp-points{list-style:none;display:flex;flex-direction:column;gap:10px}
.exp-points li{position:relative;padding-left:22px;color:var(--text-2);font-size:.9rem}
.exp-points li::before{content:'';position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary))}
/* 项目卡片 */
.proj-card{padding:26px 28px}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.proj-title{font-size:1.12rem;font-weight:800}
.proj-sub{color:var(--text-muted);font-size:.84rem;margin-bottom:12px}
.tech-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tech-tag{font-size:.72rem;font-weight:600;color:var(--secondary);background:color-mix(in srgb,var(--secondary) 10%,transparent);border:1px solid color-mix(in srgb,var(--secondary) 26%,transparent);padding:3px 10px;border-radius:16px}
.proj-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:.84rem;font-weight:600;color:var(--primary);text-decoration:none}
.proj-link:hover{text-decoration:underline}
.proj-link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ============ 技能矩阵 ============ */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.skill-group{padding:22px}
.skill-group h3{font-size:.98rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.skill-group h3::before{content:'';width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--primary),var(--secondary));transform:rotate(45deg)}
.skill-item{margin-bottom:13px}
.skill-item:last-child{margin-bottom:0}
.skill-row{display:flex;justify-content:space-between;font-size:.83rem;margin-bottom:5px}
.skill-name{color:var(--text-2);font-weight:500}
.skill-pct{color:var(--text-muted);font-size:.76rem}
.progress{height:7px;border-radius:4px;background:var(--progress-bg);overflow:hidden}
.progress-bar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width 1s cubic-bezier(.22,.61,.36,1) .15s}
/* ============ 教育与证书 ============ */
.edu-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.edu-card{padding:26px 28px}
.edu-school{font-size:1.2rem;font-weight:800}
.edu-meta{color:var(--text-2);font-size:.9rem;margin:4px 0 14px}
.edu-courses{font-size:.85rem;color:var(--text-2);background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px}
.edu-courses b{color:var(--text)}
.edu-points{list-style:none;display:flex;flex-direction:column;gap:8px}
.edu-points li{position:relative;padding-left:20px;color:var(--text-2);font-size:.87rem}
.edu-points li::before{content:'';position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cert-list{display:flex;flex-direction:column;gap:10px}
.cert-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border);transition:all var(--tr)}
.cert-item:hover{transform:translateX(4px);border-color:var(--primary-light)}
.cert-icon{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--badge-bg),color-mix(in srgb,var(--secondary) 14%,transparent))}
.cert-icon svg{width:18px;height:18px;fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cert-name{font-size:.87rem;font-weight:600}
.cert-time{font-size:.74rem;color:var(--text-muted)}
/* 自我评价 */
.eval-card{padding:24px 28px;margin-top:16px;font-size:.92rem;color:var(--text-2);border-left:4px solid var(--primary)}
/* ============ 照片墙（自动轮播） ============ */
.c-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.carousel{position:relative;width:100%;max-width:min(340px,100%);aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--bg-soft);box-shadow:var(--shadow)}
.carousel.wide{max-width:min(760px,100%);aspect-ratio:4/3}
.c-track{display:flex;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);will-change:transform}
.c-slide{flex:0 0 100%;height:100%;position:relative;cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.c-slide img{width:100%;height:100%;object-fit:cover;display:block}
.c-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(15,23,42,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.c-nav:hover{background:rgba(15,23,42,.62)}
.c-nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-nav.c-prev{left:10px}
.c-nav.c-next{right:10px}
.c-dots{display:flex;gap:8px;align-items:center}
.c-dot{width:8px;height:8px;border-radius:20px;border:none;background:var(--border);cursor:pointer;padding:0;transition:all var(--tr)}
.c-dot.on{width:22px;background:linear-gradient(90deg,var(--primary),var(--secondary))}
.g-cap{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 10px;font-size:.78rem;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
/* 照片查看器 */
.lightbox{position:fixed;inset:0;z-index:1200;background:rgba(2,6,23,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.lightbox.open{opacity:1;pointer-events:auto}
.lb-fig{max-width:92vw;max-height:88vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.lb-fig img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.lb-fig figcaption{color:#e2e8f0;font-size:.86rem;font-weight:600}
.lb-count{color:#94a3b8;font-size:.74rem}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr);z-index:2}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lb-close{top:calc(16px + env(safe-area-inset-top));right:16px}
.lb-prev{left:12px;top:50%;transform:translateY(-50%)}
.lb-next{right:12px;top:50%;transform:translateY(-50%)}
/* ============ 页脚 ============ */
footer{margin-top:64px;padding:28px 0 40px;border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:.8rem}
footer p+p{margin-top:4px;font-size:.74rem}
/* 返回顶部 & Toast */
.back-top{position:fixed;right:22px;bottom:26px;z-index:900;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(12px);transition:all var(--tr)}
.back-top.show{opacity:1;pointer-events:auto;transform:none}
.back-top:hover{color:var(--primary);border-color:var(--primary)}
.back-top svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:1100;background:var(--text);color:var(--bg);font-size:.84rem;font-weight:600;padding:11px 22px;border-radius:24px;box-shadow:var(--shadow-hover);opacity:0;pointer-events:none;transition:all var(--tr);max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ============ 响应式 ============ */
@media (max-width:820px){
  .edu-grid{grid-template-columns:1fr}
  .hero-inner{gap:22px}
  .hero h1{font-size:1.9rem}
  .avatar{width:96px;height:96px;border-radius:26px}
  .avatar span{font-size:2.4rem}
  section{padding:44px 0 6px}
}
@media (max-width:560px){
  .navbar{flex-wrap:wrap;padding:6px 14px}
  .nav-links{order:3;width:100%;padding:2px 0}
  .exp-card,.proj-card,.edu-card{padding:20px}
  .tab-btn{min-width:calc(50% - 6px);font-size:.82rem;padding:9px 10px}
  .hero{padding-top:calc(var(--nav-h) + 66px)}
  .hero h1{font-size:1.7rem}
  .btn{font-size:.8rem;padding:9px 15px}
  .carousel{max-width:100%}
  .carousel.wide{max-width:100%}
  .c-nav{width:34px;height:34px}
  .lb-btn{width:44px;height:44px}
  .lb-prev{left:6px}
  .lb-next{right:6px}
}
/* ============ 减少动效 ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
/* ============ 打印样式 ============ */
@media print{
  :root{--bg:#fff;--bg-card:#fff;--bg-soft:#f6f7f9;--text:#111;--text-2:#333;--text-muted:#555;--border:#ccc;--shadow:none;--shadow-hover:none;--badge-bg:#eee;--badge-text:#333}
  .bg-orbs,.bg-grid,.nav-actions,.back-top,.toast,.contact-row,.proj-link,.lightbox,#gallery{display:none!important}
  .navbar{position:static;backdrop-filter:none;border-bottom:2px solid #333;padding:10px 0}
  body{background:#fff}
  .hero{padding-top:20px;background:none;border:none}
  section{padding:22px 0 0;page-break-inside:avoid}
  .tab-panel{display:block!important;animation:none;margin-bottom:16px}
  .tab-bar{display:none}

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2200); }
function copyText(text, label){
  const done = () => toast('✅ ' + label + '已复制：' + text);
  const fallback = () => { const ta = el('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('⚠️ 复制失败，请手动复制：' + text); } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done).catch(fallback); } else fallback();
}

/* ================= Tabs 工厂（ARIA + 键盘左右切换） ================= */
function buildTabs(items, barEl, panelsEl, renderPanel, idPrefix){
  if (!items || !items.length){ barEl.closest('section').style.display = 'none'; return; }
  const tabs = [], panels = [];
  items.forEach((item, i) => {
    const tabId = idPrefix + '-tab-' + i, panelId = idPrefix + '-panel-' + i;
    const btn = el('button', 'tab-btn', item.tab);
    btn.id = tabId;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-controls', panelId);
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.tabIndex = i === 0 ? 0 : -1;
    const panel = el('div', 'tab-panel' + (i === 0 ? ' active' : ''));
    panel.id = panelId;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', tabId);
    panel.tabIndex = 0;
    renderPanel(item, panel);
    barEl.appendChild(btn); panelsEl.appendChild(panel);
    tabs.push(btn); panels.push(panel);
  });
  function activate(idx, focus){
    tabs.forEach((t, i) => {
      const on = i === idx;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      panels[i].classList.toggle('active', on);
    });
    if (focus) tabs[idx].focus();
  }
  barEl.addEventListener('click', e => {
    const i = tabs.indexOf(e.target.closest('.tab-btn'));
    if (i > -1) activate(i, false);
  });
  barEl.addEventListener('keydown', e => {
    const cur = tabs.indexOf(document.activeElement);
    if (cur === -1) return;
    let next = null;
    if (e.key === 'ArrowRight') next = (cur + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') next = (cur - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabs.length - 1;
    if (next !== null){ e.preventDefault(); activate(next, true); }
  });
}

/* ================= 照片墙（自动轮播）+ 查看器 ================= */
let lbList = [], lbIdx = 0, lbOpenFlag = false;
const carousels = [];
function refreshCarousels(){ carousels.forEach(c => c.refresh()); }
function createCarousel(group, panel){
  const wide = group.ratio === '4/3';
  const wrap = el('div', 'c-wrap');
  const box = el('div', 'carousel' + (wide ? ' wide' : ''));
  const track = el('div', 'c-track');
  group.items.forEach((it, idx) => {
    const slide = el('div', 'c-slide');
    const img = el('img');
    img.src = it.src;
    img.alt = it.cap || '照片';
    img.loading = idx === 0 ? 'eager' : 'lazy';
    img.addEventListener('error', () => { slide.style.display = 'none'; });
    slide.appendChild(img);
    if (it.cap) slide.appendChild(el('div', 'g-cap', it.cap));
    slide.addEventListener('click', () => openLightbox(group.items, idx));
    track.appendChild(slide);
  });
  box.appendChild(track);
  const prev = el('button', 'c-nav c-prev', '<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>');
  const next = el('button', 'c-nav c-next', '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>');
  prev.setAttribute('aria-label', '上一张');
  next.setAttribute('aria-label', '下一张');
  box.appendChild(prev); box.appendChild(next);
  const dots = el('div', 'c-dots');
  group.items.forEach((_, i) => {
    const d = el('button', 'c-dot' + (i === 0 ? ' on' : ''));
    d.setAttribute('aria-label', '第' + (i + 1) + '张');
    d.addEventListener('click', () => { go(i); restart(); });
    dots.appendChild(d);
  });
  wrap.appendChild(box); wrap.appendChild(dots);
  panel.appendChild(wrap);

  const n = group.items.length;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { box, idx: 0, timer: null, active: false, visible: false, hover: false };
  function go(i){
    state.idx = (i + n) % n;
    track.style.transform = 'translateX(-' + (state.idx * 100) + '%)';
    dots.querySelectorAll('.c-dot').forEach((d, j) => d.classList.toggle('on', j === state.idx));
  }
  function stop(){ if (state.timer){ clearInterval(state.timer); state.timer = null; } }
  function play(){
    stop();
    if (reduced || n <= 1 || !state.active || !state.visible || state.hover || lbOpenFlag) return;
    state.timer = setInterval(() => go(state.idx + 1), 3500);
  }
  function restart(){ stop(); play(); }
  state.refresh = play;
  prev.addEventListener('click', () => { go(state.idx - 1); restart(); });
  next.addEventListener('click', () => { go(state.idx + 1); restart(); });
  box.addEventListener('mouseenter', () => { state.hover = true; stop(); });
  box.addEventListener('mouseleave', () => { state.hover = false; play(); });
  // 移动端左右滑动
  let tx = 0;
  box.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40){ go(state.idx + (dx < 0 ? 1 : -1)); restart(); }
  }, { passive: true });
  return state;
}
function renderGallery(){
  const data = resume.gallery;
  if (!data || !data.length){ $('gallery').style.display = 'none'; return; }
  carousels.length = 0;
  buildTabs(data, $('galleryTabBar'), $('galleryPanels'), (group, panel) => {
    carousels.push(createCarousel(group, panel));
  }, 'gal');
  // Tab 切换：仅播放当前面板轮播
  const sync = () => {
    const panels = $('galleryPanels').children;
    carousels.forEach((c, i) => { c.active = !!(panels[i] && panels[i].classList.contains('active')); c.refresh(); });
  };
  $('galleryTabBar').addEventListener('click', () => setTimeout(sync, 0));
  $('galleryTabBar').addEventListener('keydown', () => setTimeout(sync, 0));
  // 离屏暂停播放
  const io = new IntersectionObserver(es => es.forEach(en => {
    const c = carousels.find(x => x.box === en.target);
    if (c){ c.visible = en.isIntersecting; c.refresh(); }
  }), { threshold: 0.25 });
  carousels.forEach(c => io.observe(c.box));
  // 页面切后台暂停
  document.addEventListener('visibilitychange', refreshCarousels);
  sync();
}
function openLightbox(list, idx){
  lbList = list; lbIdx = idx; lbOpenFlag = true;
  refreshCarousels();
  updateLb();
  $('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  $('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  lbOpenFlag = false;
  refreshCarousels();
}
function updateLb(){
  const it = lbList[lbIdx];
  $('lbImg').src = it.src;
  $('lbImg').alt = it.cap || '';
  $('lbCap').textContent = it.cap || '';
  $('lbCount').textContent = (lbIdx + 1) + ' / ' + lbList.length;
}
function stepLb(d){ lbIdx = (lbIdx + d + lbList.length) % lbList.length; updateLb(); }
function initLightbox(){
  $('lbClose').addEventListener('click', closeLb);
  $('lbPrev').addEventListener('click', () => stepLb(-1));
  $('lbNext').addEventListener('click', () => stepLb(1));
  $('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!$('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') stepLb(-1);
    else if (e.key === 'ArrowRight') stepLb(1);
  });
  // 移动端左右滑动切换
  let tx = 0;
  $('lightbox').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('lightbox').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1);
  }, { passive: true });
}

/* ================= 主题 ================= */
function initTheme(){
  const saved = localStorage.getItem('resume-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
  $('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    localStorage.setItem('resume-theme', next);
  });
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('iconMoon').style.display = t === 'dark' ? 'none' : 'block';
  $('iconSun').style.display = t === 'dark' ? 'block' : 'none';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === 'dark' ? '#0f172a' : '#4f46e5';
}

/* ================= 交互 ================= */
function initInteractions(){
  // 打印
  $('printBtn').addEventListener('click', () => window.print());
  // 导航阴影 + 返回顶部
  const nav = $('navbar'), top = $('backTop');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 10);
    top.classList.toggle('show', window.scrollY > 480);
  }, { passive: true });
  top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  // 进入淡入 + 技能条动画
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add('visible');
      en.target.querySelectorAll('.progress-bar').forEach(b => { b.style.width = b.dataset.level + '%'; });
      io.unobserve(en.target);
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(n => io.observe(n));
  // 导航 scrollspy
  const links = Array.from(document.querySelectorAll('.nav-links a'));
  const secs = links.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
  const spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id));
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach(s => spy.observe(s));
  // 页脚时间
  const now = new Date();
  $('year').textContent = now.getFullYear();
  $('updateDate').textContent = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
}

initTheme();
initInteractions();
