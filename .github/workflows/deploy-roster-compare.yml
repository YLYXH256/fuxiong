name: Deploy roster compare

on:
  push:
    branches: [main]
    paths:
      - 'roster-compare/**'
      - '.github/workflows/deploy-roster-compare.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: roster-compare
        run: npm install --no-audit --no-fund
      - name: Build static site
        working-directory: roster-compare
        run: npm run build
      - name: Assemble existing site and app
        run: |
          mkdir -p public/roster-compare
          rsync -a --exclude '.git' --exclude '.github' --exclude 'roster-compare' --exclude 'public' ./ public/
          rsync -a roster-compare/dist/ public/roster-compare/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
